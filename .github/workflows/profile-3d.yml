name: GitHub Profile 3D Contrib

on:
  schedule:
    # Sekali sehari pukul 18:00 UTC (01:00 WIB dini hari)
    - cron: "0 18 * * *"

  workflow_dispatch:

  push:
    branches:
      - main
    paths-ignore:
      - 'profile-3d-contrib/**'
      - 'README.md'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate 3D contribution graph
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit & push 3D graph
        run: |
          git config user.name "fadhila36"
          git config user.email "yuffa36@gmail.com"
          git add -A .
          if git commit -m "chore(contrib): update 3d contribution calendar"; then
            git push
          fi
